<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sealink · Website concepts</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ============ Base (shared, no visual style) ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ul,figure{margin:0;padding:0}
ul{list-style:none}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.w{max-width:calc(1240px + 2*var(--pad));margin:0 auto;padding-inline:var(--pad)}
:root{--pad:clamp(20px,5vw,100px)}
.mk,.crop,.sweep,.ta{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:18px;height:18px;flex:none}

/* ============ Switcher bar (presentation chrome, not part of the site) ============ */
#bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:28px;height:52px;padding:0 20px;background:#18181B;color:#E4E4E7;font:500 13px/1 system-ui,-apple-system,sans-serif}
#bar .grp{display:flex;gap:4px;align-items:center}
#bar .lbl{color:#A1A1AA;margin-right:6px}
#bar a{text-decoration:none;padding:8px 12px;border-radius:6px;color:#D4D4D8}
#bar a:hover{background:#27272A}
#bar a[aria-current="true"]{background:#F4F4F5;color:#18181B}
#bar .note{margin-left:auto;color:#A1A1AA}
#bar a.back{color:#fff;margin-right:12px;border:1px solid #3F3F46}
body.bare #bar{display:none}
#bar a{white-space:nowrap}
@media (max-width:1500px){#bar{height:auto;min-height:52px;flex-wrap:wrap;gap:6px 20px;padding-block:6px}#bar .note{display:none}}
@media (max-width:900px){#bar{height:auto;flex-wrap:wrap;gap:6px 12px;padding:8px 10px}#bar .note{display:none}#bar a{padding:7px 8px}}
@media (max-width:600px){#bar .lbl{display:none}#bar .grp{width:100%;overflow-x:auto;scrollbar-width:none}#bar a{white-space:nowrap}#bar a.back{margin-right:4px}}

/* ============ Shared structure ============ */
.hd .w{display:flex;align-items:center}
.hd .logo img{display:block}
.hd nav{display:flex}
.hd nav a{text-decoration:none}
.hd .side{margin-left:auto;display:flex;align-items:center}
.hd .side a{text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.hd .menu{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap;cursor:pointer}
.search{display:flex;align-items:center}
.search .q{flex:1;display:flex;overflow:hidden;align-items:center;gap:12px;min-width:0}
.search .q span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .cols{display:grid}
.ft a{text-decoration:none}
.card .img{display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img img{object-fit:contain}
.card .nph{display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%}
.card .add{width:100%}
.grid{display:grid}
.qbar{position:sticky;bottom:0;z-index:5}
.qbar .w{display:flex;align-items:center;gap:20px}
.qbar .w>:last-child{margin-left:auto}
.fbtn{display:none}
.outlet .w{display:flex;align-items:center;flex-wrap:wrap}
.outlet img{height:34px;width:auto}

/* =====================================================================
   3 · NAVY AND PAPER   [data-v="paper"]   white page, Sealink navy, grey bands, quiet corporate
   ===================================================================== */
[data-v="paper"]{--n:#1B1464;--ink2:#2B2A3A;--soft:#5B5A6E;--line:#E3E4EA;--band:#F5F6F8;--tint:#E7EAF6;--f:'Instrument Sans',system-ui,sans-serif;
  font-family:var(--f);color:var(--ink2);font-size:17px;line-height:1.6;background:#fff}
[data-v="paper"] h1,[data-v="paper"] h2,[data-v="paper"] h3{color:var(--n);font-weight:500;letter-spacing:-.02em}
[data-v="paper"] .x{background:var(--band);border:1px solid var(--line);padding:0 6px;border-radius:3px;font-size:.92em;white-space:nowrap}
[data-v="paper"] .btn{height:50px;padding:0 22px;border-radius:4px;font:500 16px/1 var(--f);background:var(--n);color:#fff;border:1px solid var(--n)}
[data-v="paper"] .btn.s{background:#fff;color:var(--n);border-color:#C9CBD8}
[data-v="paper"] .lnk{font-weight:500;color:var(--n);text-underline-offset:4px}
[data-v="paper"] .hd{border-bottom:1px solid var(--line)}
[data-v="paper"] .hd .w{height:84px;gap:48px}
[data-v="paper"] .hd .logo img{width:160px}
[data-v="paper"] .hd nav{gap:30px;font-size:15.5px;font-weight:500;color:var(--n)}
[data-v="paper"] .hd nav a[aria-current]{color:var(--n);box-shadow:inset 0 -2px 0 var(--n);padding-block:30px;margin-block:-30px}
[data-v="paper"] .hd .side{gap:22px;font-size:15.5px;font-weight:500;color:var(--n)}
[data-v="paper"] .hd .side .btn{height:44px;padding:0 18px;font-size:15px}
[data-v="paper"] .hd .menu{height:44px;padding:0 14px;border:1px solid #C9CBD8;border-radius:4px;font-weight:500;color:var(--n)}
[data-v="paper"] .search{height:58px;border:1px solid #C9CBD8;border-radius:4px;background:#fff;padding:4px}
[data-v="paper"] .search .q{padding:0 12px;color:var(--soft)}
[data-v="paper"] .search .go{height:100%;padding:0 22px;border-radius:3px;background:var(--n);color:#fff;font-weight:500}
[data-v="paper"] .stg{display:inline-flex;align-items:center;height:44px;padding:0 18px;border:1px solid #C9CBD8;border-radius:22px;text-decoration:none;color:var(--n);font-weight:500;font-size:15.5px;background:#fff}
[data-v="paper"] .stg.on{background:var(--n);border-color:var(--n);color:#fff}
[data-v="paper"] .ph{background:var(--band);border:1px solid var(--line);border-radius:4px;display:flex;align-items:flex-end;padding:14px 16px;font-size:14px;color:var(--soft)}
[data-v="paper"] .hero .w{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:center;padding-block:80px 88px}
[data-v="paper"] .hero h1{font-size:clamp(40px,4.4vw,62px);line-height:1.05;max-width:15ch}
[data-v="paper"] .hero .who{font-size:19px;margin-top:20px;color:var(--ink2)}
[data-v="paper"] .hero .search{margin-top:36px}
[data-v="paper"] .hero .short{display:flex;gap:8px;margin-top:14px;align-items:center}
[data-v="paper"] .hero .short .lb{font-size:15px;color:var(--soft);margin-right:6px}
[data-v="paper"] .hero .acts{display:flex;gap:10px;margin-top:32px}
[data-v="paper"] .hero .ph{height:480px}
[data-v="paper"] section.blk{padding-top:96px}
[data-v="paper"] .sh{margin-bottom:28px}
[data-v="paper"] .sh h2{font-size:clamp(28px,2.8vw,40px);line-height:1.15}
/* why: grey band, two columns */
[data-v="paper"] .why{background:var(--band);padding-block:88px;margin-top:0}
[data-v="paper"] section.why.blk{padding-top:88px}
[data-v="paper"] .why .w{display:grid;grid-template-columns:1fr 2fr;gap:64px}
[data-v="paper"] .why .sh{margin:0}
[data-v="paper"] .why .more{display:inline-block;margin-top:20px}
[data-v="paper"] .why .rows{border-top:1px solid #D5D7E0}
[data-v="paper"] .why .row{display:grid;grid-template-columns:1.3fr 1fr 1.6fr;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid #D5D7E0}
[data-v="paper"] .why .row h3{font-size:20px}
[data-v="paper"] .why .row .r{color:var(--soft)}
/* categories */
[data-v="paper"] .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
[data-v="paper"] .cat{display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 20px;border:1px solid var(--line);border-radius:4px;text-decoration:none;color:var(--n);font-weight:500;font-size:17px}
[data-v="paper"] .cat::after{content:"";width:8px;height:8px;border-top:1.5px solid var(--n);border-right:1.5px solid var(--n);transform:rotate(45deg)}
[data-v="paper"] .cat:hover{background:var(--band)}
/* trade */
[data-v="paper"] .trade{margin-top:96px;background:var(--n);color:#fff}
[data-v="paper"] .trade .w{display:grid;grid-template-columns:1.5fr 1fr;gap:12px 48px;align-items:center;padding-block:64px}
[data-v="paper"] .trade h2{color:#fff;font-size:clamp(26px,2.6vw,36px);line-height:1.25}
[data-v="paper"] .trade .rt{margin-top:12px;color:#D4D2EC}
[data-v="paper"] .trade .x{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
[data-v="paper"] .trade .acts{grid-column:2;grid-row:1/3;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
[data-v="paper"] .trade .btn{background:#fff;color:var(--n);border-color:#fff}
[data-v="paper"] .trade .btn.s{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
[data-v="paper"] .outlet{border-bottom:1px solid var(--line)}
[data-v="paper"] .outlet .w{gap:18px;min-height:72px;padding-block:12px;font-size:16px}
[data-v="paper"] .outlet .lnk{margin-left:auto}
/* home: Meatplus line in the hero, Meatplus section; products: intro line and Meatplus row */
[data-v="paper"] .hero+section.blk{padding-top:24px}
[data-v="paper"] section.why.after{margin-top:96px}
[data-v="paper"] .why.after+.trade{margin-top:0}
[data-v="paper"] .hero .mpline{margin-top:22px;font-size:16px;color:var(--ink2)}
[data-v="paper"] .mps{padding-block:88px;border-bottom:1px solid var(--line)}
[data-v="paper"] .mps>.w{display:grid;grid-template-columns:1fr 1.6fr;gap:64px;align-items:start}
[data-v="paper"] .mps .mplogo{width:150px;height:auto;margin-bottom:24px}
[data-v="paper"] .mps h2{font-size:clamp(28px,2.8vw,40px);line-height:1.15}
[data-v="paper"] .mps .txt p{margin-top:14px;color:var(--ink2);max-width:46ch}
[data-v="paper"] .mps .txt .lnk{display:inline-block;margin-top:22px}
[data-v="paper"] .mps .ol{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
[data-v="paper"] .mps .o{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:4px;padding:20px;text-decoration:none;color:var(--ink2);font-size:15.5px}
[data-v="paper"] .mps .o h3{font-size:19px;margin-bottom:4px}
[data-v="paper"] .mps .o .go{margin-top:auto;padding-top:10px;font-weight:500;color:var(--n);text-decoration:underline;text-underline-offset:4px}
[data-v="paper"] .mps .o:hover{background:var(--band)}
[data-v="paper"] .ptop .pintro{margin-top:16px;font-size:17px;color:var(--ink2);max-width:44ch}
[data-v="paper"] .mprow{border-bottom:1px solid var(--line)}
[data-v="paper"] .mprow .w{display:flex;align-items:center;gap:16px;padding-block:12px;font-size:16px}
[data-v="paper"] .mprow img{width:66px;height:auto;flex:none}
[data-v="paper"] .mprow .lnk{margin-left:auto;white-space:nowrap}
[data-v="paper"] .ft{background:var(--n);color:#fff;padding:64px 0 52px}
[data-v="paper"] .ft .cols{grid-template-columns:2fr 1.3fr 1fr;gap:40px}
[data-v="paper"] .ft img{width:170px}
[data-v="paper"] .ft p,[data-v="paper"] .ft li{font-size:15px;line-height:26px}
[data-v="paper"] .ft h4{margin:0 0 10px;font-weight:500;font-size:15px;color:#D4D2EC}
[data-v="paper"] .ft .x{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
[data-v="paper"] .ft a{text-decoration:underline;text-underline-offset:3px}
/* products */
[data-v="paper"] .ptop{background:var(--band);border-bottom:1px solid var(--line)}
[data-v="paper"] .ptop .w{display:grid;grid-template-columns:1fr 1.3fr;gap:40px;align-items:end;padding-block:52px 36px}
[data-v="paper"] .ptop h1{font-size:48px;line-height:1}
[data-v="paper"] .stabs .w{display:flex;gap:8px;padding-block:22px;border-bottom:1px solid var(--line)}
[data-v="paper"] .pbody{display:grid;grid-template-columns:230px 1fr;gap:48px;padding-block:32px 64px}
[data-v="paper"] .filters h3{font-size:16px;margin:0 0 8px}
[data-v="paper"] .filters h3:not(:first-child){margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
[data-v="paper"] .filters label{display:flex;align-items:center;gap:10px;min-height:36px;font-size:15.5px}
[data-v="paper"] .filters input{width:17px;height:17px;accent-color:var(--n);margin:0}
[data-v="paper"] .rbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:15.5px}
[data-v="paper"] .rbar b{font-weight:500;color:var(--n)}
[data-v="paper"] .rbar .sort{color:var(--soft)}
[data-v="paper"] .grid{grid-template-columns:repeat(3,1fr);gap:20px}
[data-v="paper"] .card{border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
[data-v="paper"] .card .img{height:220px;background:#fff;border-bottom:1px solid var(--line);padding:18px}
[data-v="paper"] .card .img img{max-height:184px}
[data-v="paper"] .card .nph{background:var(--band);margin:-18px;width:calc(100% + 36px);height:calc(100% + 36px);padding:16px 18px}
[data-v="paper"] .card .nph b{font-size:26px;font-weight:500;color:var(--n);letter-spacing:-.02em}
[data-v="paper"] .card .nph span{font-size:14px;color:var(--soft)}
[data-v="paper"] .card .meta{padding:16px 18px 0;flex:1}
[data-v="paper"] .card h3{font-size:17px;line-height:1.3;letter-spacing:-.005em}
[data-v="paper"] .card .br{font-size:14px;color:var(--soft);margin-bottom:2px}
[data-v="paper"] .card .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
[data-v="paper"] .card .pk,[data-v="paper"] .card .st{font-size:13px;padding:3px 9px;border-radius:3px;background:var(--band);color:var(--ink2)}
[data-v="paper"] .card .st{background:var(--tint);color:var(--n);font-weight:500}
[data-v="paper"] .card .add{margin:16px 18px 18px;width:auto;height:44px;border:1px solid #C9CBD8;border-radius:4px;color:var(--n);font-weight:500}
[data-v="paper"] .card .add.in{background:var(--n);border-color:var(--n);color:#fff}
[data-v="paper"] .nores{margin-top:32px;padding:24px;border:1px dashed #C9CBD8;border-radius:4px}
[data-v="paper"] .nores .tag{display:block;font-size:13px;color:var(--soft)}
[data-v="paper"] .nores p{font-size:18px;color:var(--n);margin-top:4px}
[data-v="paper"] .qbar{background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(27,20,100,.06)}
[data-v="paper"] .qbar .w{height:72px;font-weight:500;color:var(--n)}
[data-v="paper"] .qbar .n{color:var(--soft);font-weight:400}
/* brands */
[data-v="paper"] .btop{background:var(--band);border-bottom:1px solid var(--line)}
[data-v="paper"] .btop .w{padding-block:64px 56px}
[data-v="paper"] .btop h1{font-size:52px;line-height:1}
[data-v="paper"] .btop p{font-size:20px;margin-top:16px;max-width:48ch}
[data-v="paper"] .origins .w{padding-block:40px;border-bottom:1px solid var(--line)}
[data-v="paper"] .origins p{font-size:19px;color:var(--n)}
[data-v="paper"] .others .w{padding-block:56px 72px}
[data-v="paper"] .others h2{font-size:30px;margin-bottom:12px}
@media (max-width:900px){
  [data-v="paper"] .hd .w{height:66px;gap:12px}[data-v="paper"] .hd .logo img{width:124px}
  [data-v="paper"] .hero .w,[data-v="paper"] .why .w,[data-v="paper"] .trade .w,[data-v="paper"] .ptop .w{grid-template-columns:1fr;gap:28px}
  [data-v="paper"] .hero .w{padding-block:40px 52px}
  [data-v="paper"] .hero .ph{height:220px}
  [data-v="paper"] .hero .short .lb{display:none}
  [data-v="paper"] .short .stg{flex:1;justify-content:center}
  [data-v="paper"] .why{padding-block:56px}[data-v="paper"] section.why.blk{padding-top:56px}
  [data-v="paper"] .why .row{grid-template-columns:1fr;gap:2px}
  [data-v="paper"] .cats{grid-template-columns:1fr 1fr;gap:8px}[data-v="paper"] .cat{height:64px;font-size:16px;padding:0 14px}
  [data-v="paper"] .trade{margin-top:64px}[data-v="paper"] .trade .acts{grid-column:1;grid-row:auto;justify-content:flex-start}
  [data-v="paper"] .outlet .lnk{margin-left:0}
  [data-v="paper"] section.why.after{margin-top:64px}
  [data-v="paper"] .mps{padding-block:56px}[data-v="paper"] .mps>.w{grid-template-columns:1fr;gap:28px}[data-v="paper"] .mps .mplogo{width:120px;margin-bottom:18px}
  [data-v="paper"] .mps .ol{grid-template-columns:1fr;gap:10px}
  [data-v="paper"] .ptop .pintro{font-size:16px;margin-top:12px}
  [data-v="paper"] .mprow .w{display:grid;grid-template-columns:54px 1fr;gap:4px 14px;align-items:start;padding-block:14px;font-size:15px}[data-v="paper"] .mprow img{width:54px;grid-row:1/3}[data-v="paper"] .mprow .lnk{margin-left:0;justify-self:start}
  [data-v="paper"] .ft .cols{grid-template-columns:1fr;gap:28px}
  [data-v="paper"] .stabs .w{overflow-x:auto}
  [data-v="paper"] .pbody{grid-template-columns:1fr;gap:16px;padding-top:20px}
  [data-v="paper"] .grid{grid-template-columns:1fr 1fr;gap:12px}
  [data-v="paper"] .card .img{height:150px;padding:10px}[data-v="paper"] .card .img img{max-height:128px}
  [data-v="paper"] .card .nph{margin:-10px;width:calc(100% + 20px);height:calc(100% + 20px);padding:10px}[data-v="paper"] .card .nph b{font-size:20px}
  [data-v="paper"] .card .meta{padding:12px 12px 0}[data-v="paper"] .card .add{margin:12px}
  [data-v="paper"] .fbtn{display:inline-flex;height:44px;padding:0 16px;border:1px solid #C9CBD8;border-radius:4px;align-items:center;font-weight:500;color:var(--n)}
}

/* ruled rows: keep the rule to the content width, not the padded box */
[data-v="paper"] .stabs .w,[data-v="paper"] .origins .w{padding-inline:0;width:calc(100% - 2*var(--pad));max-width:1240px}

/* sample photos fill the [PHOTO] slots */
.ph.pic{position:relative;overflow:hidden;padding:0!important;border:0!important;background:#D9D7E6}
.ph.pic img,.card .nph.pic img{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;display:block}
.card .nph.pic{position:relative;overflow:hidden;padding:0!important}

/* products without a pack shot: plain white panel, same frame as the pack shots */
.card .nph{background:#fff!important;color:var(--n,#1C1266)}
.card .nph span{color:#6B6F80}

/* ============ Shared mobile ============ */
@media (max-width:900px){
  .hero .w,.ptop .w,.trade .w{grid-template-columns:minmax(0,1fr)!important}
  .hero .w>*,.short .stg,.seg .stg{min-width:0}
  .short .stg{padding-inline:6px!important}
  .hd nav,.hd .side .hm{display:none}
  .hd .menu{display:inline-flex;align-items:center}
  .hd .side{gap:10px!important}
  .hd .side .btn{height:40px!important;padding:0 12px!important;font-size:14px!important}
  .filters{display:none}
  .rbar{flex-wrap:wrap;gap:10px}
  .outlet .w{gap:10px 14px!important}
  .qbar .w{gap:12px!important}
  .qbar .hm{display:none}
}

/* =====================================================================
   4 · FINAL   [data-v="final"]   Navy and paper, plus the cut Apex A
   The page renders inside an inner [data-v="paper"] wrapper, so every paper
   rule applies as is. This block only adds the A and styles the new pages.
   ===================================================================== */
[data-v="final"]{--r:#F03010}
[data-v="final"] .A{display:block;aspect-ratio:163/331;background:var(--c,var(--r));-webkit-mask:url(assets/apex.svg) center/contain no-repeat;mask:url(assets/apex.svg) center/contain no-repeat}
[data-v="final"] .x{white-space:normal}
/* section marks */
[data-v="final"] .sh{display:flex;align-items:center;gap:14px}
[data-v="final"] .sh .mk{display:block;width:14px;flex:none;align-self:center}
/* storage tags */
[data-v="final"] .stg{gap:9px}
[data-v="final"] .stg .ta{display:block;width:8px;flex:none}
[data-v="final"] .card .st,[data-v="final"] .tag-st{display:inline-flex;align-items:center;gap:6px}

/* =====================================================================
   5 · POLISH   fewer lines, the A only in big places, calm motion
   ===================================================================== */
[data-v="paper"]{--ease:cubic-bezier(.22,.7,.2,1);--rad:10px}
/* fewer lines: spacing and soft bands instead of rules */
[data-v="paper"] .hd,[data-v="paper"] .ptop,[data-v="paper"] .btop,[data-v="paper"] .outlet,[data-v="paper"] .mprow,[data-v="paper"] .mps,[data-v="paper"] .stabs .w,[data-v="paper"] .origins .w{border:0}
[data-v="paper"] .x{border:0;border-radius:4px}
[data-v="paper"] .filters h3:not(:first-child){border-top:0;padding-top:0}
[data-v="paper"] .card{border:0;border-radius:var(--rad);transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
[data-v="paper"] .card .img{border-bottom:0;border-radius:var(--rad)}
[data-v="paper"] .card .img img{transition:transform .5s var(--ease)}
[data-v="paper"] .card:hover{box-shadow:0 14px 36px rgba(27,20,100,.08)}
[data-v="paper"] .card:hover .img img{transform:scale(1.04)}
[data-v="paper"] .qbar{border-top:0}
[data-v="paper"] .nores{border:0;background:var(--band);border-radius:var(--rad)}
[data-v="paper"] .outlet{background:var(--band)}
[data-v="final"] .facts,[data-v="final"] .facts>div{border:0}
[data-v="final"] .facts>div{padding:10px 0}
[data-v="final"] .facts dt{color:var(--soft);font-weight:500}
[data-v="final"] .fband{border:0}
[data-v="final"] .fband .side .alt{border-top:0;padding-top:0}
[data-v="final"] .fform{border:0;border-radius:var(--rad);box-shadow:0 10px 40px rgba(27,20,100,.06)}
[data-v="final"] .oc{border:0;background:var(--band);border-radius:var(--rad)}
[data-v="final"] .oc .ph{border:0}
[data-v="final"] .pd .shot{border:0;background:var(--band);border-radius:var(--rad)}
[data-v="final"] .steps li{border-top:0;padding-top:0}
[data-v="paper"] .ph{border:0;border-radius:var(--rad)}
[data-v="paper"] .ph.pic{border-radius:var(--rad)}
/* the A: only the hero photo crop and the navy trade band */
[data-v="final"] .sh .mk,[data-v="final"] .stg .ta,[data-v="final"] .ptop .crop,[data-v="final"] .btop .crop{display:none}
[data-v="final"] .card .st::before,[data-v="final"] .tag-st::before{display:none}
[data-v="final"] .ph.pic::after{display:none}
[data-v="final"] .hero .ph.pic::after{display:block}
[data-v="final"] .map .pin{width:16px;height:16px;border-radius:50%;background:var(--r);transform:translate(-50%,-50%)}
/* header: proposal nav */
[data-v="paper"] .hd .w{gap:40px}
[data-v="paper"] .hd nav{gap:26px;font-size:15px}
[data-v="paper"] .hd nav a{white-space:nowrap;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;padding-bottom:3px;transition:background-size .3s var(--ease),color .2s}
[data-v="paper"] .hd nav a:hover{background-size:100% 1.5px}
[data-v="paper"] .hd nav a[aria-current]{box-shadow:none;padding-block:0 3px;margin-block:0;background-size:100% 1.5px}
[data-v="paper"] .hd .side .hm{white-space:nowrap}
[data-v="paper"] .hd.open nav{display:flex;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:#fff;padding:8px var(--pad) 20px;box-shadow:0 20px 40px rgba(27,20,100,.08);z-index:30;font-size:18px}
[data-v="paper"] .hd.open nav a{padding:12px 0;background:none}
[data-v="paper"] .hd{position:relative;z-index:20}
@media (max-width:1180px){[data-v="paper"] .hd nav{display:none}[data-v="paper"] .hd .menu{display:inline-flex;align-items:center}[data-v="paper"] .hd .side .hm{display:none}}
/* buttons and links */
[data-v="paper"] .btn{border-radius:999px;transition:transform .25s var(--ease),background .25s,box-shadow .25s}
[data-v="paper"] .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(27,20,100,.16)}
[data-v="paper"] .btn.s:hover{box-shadow:none;background:var(--band)}

[data-v="paper"] .lnk::after{content:" \2192";display:inline-block;transition:transform .3s var(--ease)}
[data-v="paper"] .lnk:hover::after{transform:translateX(4px)}
[data-v="paper"] a:focus-visible,[data-v="paper"] button:focus-visible,[data-v="paper"] [tabindex]:focus-visible{outline:2px solid var(--r,#F03010);outline-offset:3px;border-radius:4px}

/* section rhythm */
[data-v="paper"] .pz{padding-block:120px}
[data-v="paper"] .pz.band{background:var(--band)}
[data-v="paper"] .pz h2{font-size:clamp(30px,3vw,44px);line-height:1.12;max-width:20ch}

[data-v="paper"] .hero .w{padding-block:96px 120px}
[data-v="paper"] .hero .ph{height:540px}

/* tabs */
.tabs [role=tablist]{display:flex;gap:6px;flex-wrap:wrap}

@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* home: range tabs */
[data-v="paper"] .range .top{display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap;margin-bottom:40px}
[data-v="paper"] .range .pnl{display:grid;grid-template-columns:1fr 2.4fr;gap:56px;align-items:start}

[data-v="paper"] .logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:48px}

[data-v="paper"] .band .logo-t .lg{background:#fff}
[data-v="paper"] .pz:not(.band) .logo-t .lg{background:var(--band)}
[data-v="paper"] .logo-t:hover .lg{transform:translateY(-3px);box-shadow:0 14px 36px rgba(27,20,100,.08)}
[data-v="paper"] .logo-t img{max-height:72px;max-width:70%;width:auto;height:auto}
[data-v="paper"] .logo-t b{display:block;color:var(--n);font-weight:500;font-size:16px}
[data-v="paper"] .logo-t .lg.dk,[data-v="paper"] .pz:not(.band) .logo-t .lg.dk{background:var(--n)}
/* carousel */
[data-v="paper"] .car .top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px}

  const story = `<section class="pz band"><div class="w"><p class="eyebrow">Our story</p><h2>How a family business grew.</h2>
     <div class="story"><div class="st-pics">${CH.map((c,i)=>`<figure class="spic${i?'':' on'}" data-i="${i}">${pic(c[0],c[1],c[2])}</figure>`).join('')}</div>
     <div class="st-text">${CH.map((c,i)=>`<div class="chap" data-i="${i}"><div class="chap-m">${pic(c[0],c[1],c[2])}</div><small class="sc">${c[3]}</small><h3>${c[4]}</h3><p>${c[5]}</p>${c[6]?`<p>${c[6]}</p>`:''}</div>`).join('')}</div></div>
   </div></section>`;
  const person=(n,role,since,short,bio)=>`<article class="person2"><div class="ph">${x('[PORTRAIT]')}</div><div><small class="sc">Since ${since}</small><h3>${n}</h3><p class="role">${role}</p><p>${short}</p>
     <details class="acc"><summary>Education and background</summary><div><p>${bio}</p></div></details></div></article>`;
  return header(V,'about')+`<main>
   <section class="ab-top"><div class="w"><p class="eyebrow">About Us · Family owned since 1994</p>
     <h1>Moosa Hassan founded Sealink in 1994. His family still owns it.</h1>
     <p class="intro">Today Sealink is one of the main importers and distributors of fresh, chilled and frozen food in the Maldives, with its own cold store and an outlet in Malé. Most people know us by our trade name, Meatplus.</p></div></section>
   ${story}
   ${track}
   <section class="dark"><div class="w"><p class="eyebrow">Leadership</p><h2>Two family directors run the company.</h2>
     <div class="people2">
       ${person('Reena Moosa','Managing Director','2006','Reena oversees the Finance and Accounts Department.','Before joining Sealink, Reena worked in human resources at Malé Water and Sewerage Company for five years. She holds a Bachelor of Commerce (Small Business Management) from Curtin University of Technology, Australia.')}
       ${person('Dheena Moosa','Operations, Sales and Marketing','2009','Dheena oversees operations, sales and marketing.','Dheena worked in the government sector for over six years, on national planning and development and on social protection. She served three years on the board of the Maldives Pension Administration Office. She holds a Master of Development Economics from the Australian National University and a Bachelor of Commerce from Curtin University of Technology.')}
     </div>
     <p class="owners">The other shareholders are Moosa Hassan, Shaazly Shafeeg, Zeena Moosa and Lubna Moosa. They are not involved in daily operations.</p></div></section>
   <section class="ovl"><div class="ovl-img">${pic('warehouse-pallets','pallets in the cold store','50% 60%')}</div>
     <div class="w"><div class="ovl-p"><p class="eyebrow">Cold chain</p><h2>Our own cold store</h2><p class="intro">Frozen, chilled and fresh goods stay in our own cold storage facility until they go out to customers.</p>
       ${facts([[fi('cube','Capacity'),x('[CAPACITY]')],[fi('snow','Frozen'),x('[TEMPERATURE]')],[fi('drop','Chilled'),x('[TEMPERATURE]')],[fi('leaf','Fresh'),x('[TEMPERATURE]')],[fi('truck','Delivery'),x('[DELIVERY: atolls served]')]])}</div></div></section>
   <section class="pz"><div class="w row2">
     <div><p class="eyebrow">Our customers</p><h2>Built together with the people we supply.</h2>
       <p class="intro">Resort and hotel kitchens, restaurants and caterers, and the families who shop at Meatplus. We try to stay the same familiar people for them year after year, and to grow the range with what they ask for.</p>
       <p class="intro">${x('[CUSTOMERS: a few names, with permission]')}</p></div>
     ${pic('chefs','chefs at work in a hotel kitchen','55% 60%')}
   </div></section>
   <section class="pz band"><div class="w"><div class="top2"><div><p class="eyebrow">Partners</p><h2>Producers we have worked with for years.</h2></div><a class="lnk" ${L('brands')}>Our brands</a></div>
     <div class="logos">${PARTNERS.map(p=>`<a class="logo-t" ${L('brands')}><span class="lg${p.dark?' dk':''}"${p.dark?' style="background:var(--n)"':''}><img src="${lg(p)}" alt="${p.name}"></span><span><small class="sc">Since ${p.role.match(/\d{4}/)[0]}</small><b>${p.name}, ${p.country}</b></span></a>`).join('')}</div></div></section>
   <section class="pz"><div class="w"><p class="eyebrow">Certificates</p><h2>Certificates</h2>
     ${facts([['Halal',x('[HALAL CERTIFICATE: body, number, expiry]')],['Food safety',x('[MFDA OR OTHER LICENCE]')]])}</div></section>
   ${outlet(V)}
  </main>`+footer(V);
}

    ${facts([['Address',x('[ADDRESS]')],['Phone',x('[PHONE]')],['Open today',x('[HOURS TODAY]')]])}

   <section class="ab-top"><div class="w"><p class="eyebrow">Contact Us</p><h1>Call, message or visit us in Malé.</h1>

       ${facts([[fi('pin','Address'),ADDR],[fi('phone','Phone'),`<a href="tel:+9603332933">${PHONE}</a>`],[fi('chat','WhatsApp'),x('[NUMBER]')],[fi('chat','Viber'),x('[NUMBER]')],[fi('mail','Email'),x('[EMAIL]')],[fi('clock','Office hours'),x('[OFFICE HOURS]')]])}

   </div></section>
   <section class="pz mpo" id="outlets"><div class="w">
     <div class="top2"><div><img class="mpo-logo" src="${MP}" alt="Meatplus Foods"><h2>Meatplus Foods outlets</h2>
       <p class="intro">Meatplus Foods is Sealink’s retail and wholesale brand. Anyone can walk in and buy for home.</p></div></div>

     <p class="onote">Outlet list to come: ${x('[NUMBER OF OUTLETS AND LOCATIONS]')}</p>
     <div class="split" style="margin-top:56px"><div><p class="eyebrow">What you can buy</p><p class="lede">${x('[OUTLET RANGE: what the outlets sell]')}</p></div>
       <div class="ph map"><i class="pin" aria-hidden="true"></i>${x('[MAP: outlet locations]')}</div></div>
   </div></section>
   <section class="fband" style="margin-top:0"><div class="w">
     <div class="side"><p class="eyebrow">Send a message</p><h2>Write to us</h2><p>For trade prices, the quote form on the HORECA page is quicker.</p>
       <p class="alt"><a class="lnk" ${L('trade')}>Request a quote</a></p></div>
     <form class="fform" onsubmit="return false" aria-label="Contact form">

       ${field('Email','email','','(optional)')}${field('Topic',['Trade quote','Brands and partners','Meatplus outlets','Careers','Something else'])}
       ${field('Message','area','full')}
       <div class="send full"><button class="btn" type="button">Send message</button></div>
     </form>
   </div></section>
  </main>`+footer(V);

const DEFAULT_PRODUCT=()=>Math.max(0,PRODUCTS.findIndex(p=>p.name.startsWith('Cream Cheese')&&p.img));
const pimg=p=>p.img?IMG+p.img:p.ph?IMG+p.ph+'.webp':'';
function product(V,s){
  const i=PRODUCTS[s&&s.i]?s.i:DEFAULT_PRODUCT(), p=PRODUCTS[i], src=pimg(p);
  const rel=PRODUCTS.map((q,j)=>[q,j]).filter(([q,j])=>j!==i&&q.cat===p.cat&&q.name!==p.name).slice(0,4);
  return header(V,'products')+`<main>
   <div class="w crumbs"><a ${L('products')}>Products</a> / ${p.cat} / ${p.name}</div>
   <section class="w pd">
     <div class="shot">${src?`<img src="${src}" alt="${p.brand} ${p.name}, ${p.pack||''}">`:`<div class="none"><b>${p.brand}</b>Pack photo to come</div>`}</div>
     <div>
       <p class="br">${p.brand}</p><h1>${p.name}</h1>
       <div class="chips"><span>${p.pack||x('[PACK]')}</span><span class="tag-st">${p.st}</span></div>
       <p class="desc">${x('[DESCRIPTION: 2–3 lines]')}</p>
       <div class="acts"><button class="btn" type="button">Add to quote</button><a class="btn s" ${L('contact')}>Ask on WhatsApp</a></div>
       <p class="pnote">Prices are sent with your quote.</p>
       ${facts([['Pack size',p.pack||x('[PACK]')],['Origin',p.origin||x('[ORIGIN]')],['Storage',`${p.st}, ${x('[STORAGE TEMPERATURE]')}`],['Category',p.cat],['Product code',x('[SKU CODE]')],['Shelf life',x('[SHELF LIFE]')],['Halal',x('[HALAL STATUS]')],['Spec sheet',x('[SPEC SHEET PDF]')]])}
     </div>
   </section>
   ${rel.length?`<section class="sec last"><div class="w">${sh('More in '+p.cat.toLowerCase())}<div class="rel">${rel.map(([q])=>card(q,V)).join('')}</div></div></section>`:'<div class="sec last"></div>'}
  </main>`+footer(V);
}

/* ---------- Router (state in the URL hash: #v=apex&p=home) ---------- */
/* The final look renders the shared page functions with the paper content (V='paper')
   inside an inner [data-v="paper"] wrapper, so paper CSS applies and [data-v="final"] adds to it.
   The new pages (trade, about, contact, outlets, product) exist in the final look only. */
const VS=['final'], PS=['home','products','brands','trade','about','contact','outlets','product'];
const FINAL_ONLY=['trade','about','contact','outlets','product'];
const PAGES={home,products,brands,trade,about,contact,product,outlets:contact};
function state(){const h=new URLSearchParams(location.hash.slice(1));
  const s={v:VS.includes(h.get('v'))?h.get('v'):'final',p:PS.includes(h.get('p'))?h.get('p'):'home',i:h.has('i')?parseInt(h.get('i'),10):null,bare:h.has('bare'),to:h.get('to')};
  if(s.p==='outlets'){s.p='contact';s.to='outlets'}
  if(FINAL_ONLY.includes(s.p)&&s.v!=='final')s.v='final';
  return s}
function go(o){const s={...state(),...o};
  if(FINAL_ONLY.includes(s.p)&&s.v!=='final'){if(o.v)s.p='home';else s.v='final'}
  if(s.p!=='product')s.i=null;
  location.hash=`v=${s.v}&p=${s.p}${s.i!=null?'&i='+s.i:''}${s.bare?'&bare':''}`}
function render(){
  const s=state(), el=document.getElementById('site'); CUR=s;
  el.dataset.v=s.v; el.dataset.p=s.p; document.body.classList.toggle('bare',s.bare);
  const html=PAGES[s.p](s.v==='final'?'paper':s.v,s);
  el.innerHTML=s.v==='final'?`<div data-v="paper">${html}</div>`:html;
  document.querySelectorAll('[data-set-v]').forEach(a=>a.setAttribute('aria-current',a.dataset.setV===s.v));
  document.querySelectorAll('[data-set-p]').forEach(a=>a.setAttribute('aria-current',a.dataset.setP===s.p));
  document.title=`Sealink · ${s.v} · ${s.p}`;
  window.scrollTo(0,0);
  wire(el);
  if(s.to){const t=el.querySelector('#'+s.to);if(t)requestAnimationFrame(()=>{const hd=el.querySelector('.hd');scrollTo(0,t.getBoundingClientRect().top+scrollY-(hd?hd.offsetHeight:0)-8)})}
}
/* ---------- Interactions: reveal, tabs, carousels, menu ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let IO=null;
function wire(el){
  if(IO)IO.disconnect();
  el.querySelectorAll('.tabs [role=tablist]').forEach(moveInd);
  const hd=el.querySelector('.hd'); onscroll=()=>hd&&hd.classList.toggle('scd',scrollY>8); onscroll();
  /* scroll story: the chapter in view picks the picture */
  if('IntersectionObserver' in window){const pics=[...el.querySelectorAll('.spic')];
    if(pics.length){const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const k=+e.target.dataset.i;pics.forEach(p=>{const i=+p.dataset.i;p.classList.toggle('on',i===k);p.classList.toggle('before',i<k)})}}),{rootMargin:'-45% 0px -45% 0px'});el.querySelectorAll('.chap').forEach(c=>so.observe(c))}}
  /* timeline track: buttons, keys and drag */
  el.querySelectorAll('.trk').forEach(trk=>{
    const pin=trk.closest('.trk-pin'),st=pin&&pin.querySelector('.trk-st'),items=[...trk.children];
    const pinned=()=>pin&&pin.classList.contains('pinned');
    /* active year: the item nearest the left edge of the content column */
    const act=()=>{const x0=trk.getBoundingClientRect().left+parseFloat(getComputedStyle(trk).paddingLeft);let b=0,bd=1e9;
      items.forEach((li,i)=>{const d=Math.abs(li.getBoundingClientRect().left-x0);if(d<bd){bd=d;b=i}});
      if(trk.scrollLeft+trk.clientWidth>=trk.scrollWidth-4)b=items.length-1;items.forEach((li,i)=>li.classList.toggle('on',i===b))};
    trk.addEventListener('scroll',act,{passive:true});
    /* pinned mode: vertical scroll through the section drives the track sideways */
    const setup=()=>{const on=!RM.matches&&innerWidth>=768;pin.classList.toggle('pinned',on);
      if(on){pin.style.height=(st.offsetHeight+(trk.scrollWidth-trk.clientWidth))+'px'}else pin.style.height='';drive()};
    const drive=()=>{if(!pinned())return;const r=pin.getBoundingClientRect(),run=pin.offsetHeight-st.offsetHeight;
      const p=Math.min(1,Math.max(0,(st.getBoundingClientRect().top-r.top)/Math.max(1,run)));trk.scrollLeft=p*(trk.scrollWidth-trk.clientWidth);act()};
    if(pin){setup();addEventListener('scroll',drive,{passive:true});addEventListener('resize',setup);(document.fonts?document.fonts.ready:Promise.resolve()).then(setup)}
    const move=d=>{if(pinned())scrollBy({top:d,behavior:RM.matches?'auto':'smooth'});else trk.scrollBy({left:d,behavior:RM.matches?'auto':'smooth'})};
    el.querySelectorAll('.tb').forEach(b=>b.onclick=()=>move(+b.dataset.d*trk.clientWidth*.6));
    trk.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move((e.key==='ArrowRight'?1:-1)*280)}});
    let down=false,x0=0,s0=0;
    trk.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||pinned())return;down=true;x0=e.clientX;s0=trk.scrollLeft;trk.style.scrollSnapType='none';trk.style.scrollBehavior='auto';trk.style.cursor='grabbing'});
    addEventListener('pointerup',()=>{if(!down)return;down=false;trk.style.scrollSnapType='';trk.style.scrollBehavior='';trk.style.cursor=''});
    addEventListener('pointermove',e=>{if(down)trk.scrollLeft=s0-(e.clientX-x0)});
  });
  const els=el.querySelectorAll('main > section > .w, main > article > .w, .pz .tiles, .pz .logos, .people, .together, .lwall');
  if(!RM.matches&&'IntersectionObserver' in window){
    IO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
    els.forEach(n=>{if(n.closest('.hero'))return;n.classList.add('rv');IO.observe(n)});
  }
  el.querySelectorAll('.car').forEach(c=>{
    const t=c.querySelector('.track'),pv=c.querySelector('.prev'),nx=c.querySelector('.next');
    const upd=()=>{pv.disabled=t.scrollLeft<4;nx.disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-4};
    const step=d=>{const s=t.querySelector('.slide');t.scrollBy({left:d*(s.offsetWidth+16),behavior:RM.matches?'auto':'smooth'})};
    pv.onclick=()=>step(-1); nx.onclick=()=>step(1);
    t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});
    const pr=c.querySelector('.prog i'),cn=c.querySelector('.cnt'),n=t.querySelectorAll('.slide').length;
    const upd2=()=>{upd();if(pr)pr.style.width=Math.min(100,(t.scrollLeft+t.clientWidth)/t.scrollWidth*100)+'%';
      const sw=(t.querySelector('.slide')||{}).offsetWidth||1;if(cn)cn.textContent=`${Math.min(n,Math.round(t.scrollLeft/(sw+16))+1)} / ${n}`};
    t.addEventListener('scroll',upd2,{passive:true}); upd2();
  });
}
function moveInd(list){const i=list.querySelector('.ind'),t=list.querySelector('[aria-selected=true]');if(!i||!t)return;i.style.width=t.offsetWidth+'px';i.style.transform=`translateX(${t.offsetLeft}px)`}
function selectTab(tab,focus){
  const list=tab.closest('[role=tablist]'),root=list.parentElement;
  list.querySelectorAll('[role=tab]').forEach(b=>{const on=b===tab;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;
    const p=root.querySelector('#'+b.getAttribute('aria-controls'));if(p)p.hidden=!on});
  moveInd(list);
  if(focus)tab.focus();
  tab.scrollIntoView({block:'nearest',inline:'nearest',behavior:RM.matches?'auto':'smooth'});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('#site [role=tab]'); if(t){selectTab(t);return}
  const st=e.target.closest('#site [data-step]'); if(st){const tl=st.closest('.tabs').querySelector('[role=tablist]'),all=[...tl.querySelectorAll('[role=tab]')],i=all.findIndex(b=>b.getAttribute('aria-selected')==='true');const n=all[Math.min(all.length-1,Math.max(0,i+ +st.dataset.step))];selectTab(n);return}
  const m=e.target.closest('#site .hd .menu'); if(m){const h=m.closest('.hd'),o=h.classList.toggle('open');m.setAttribute('aria-expanded',o);m.textContent=o?'Close':'Menu'}
});
document.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('#site [role=tab]'); if(!t)return;
  const all=[...t.parentElement.querySelectorAll('[role=tab]')],i=all.indexOf(t);let n=null;
  if(e.key==='ArrowRight')n=all[(i+1)%all.length]; else if(e.key==='ArrowLeft')n=all[(i-1+all.length)%all.length];
  else if(e.key==='Home')n=all[0]; else if(e.key==='End')n=all[all.length-1];
  if(n){e.preventDefault();selectTab(n,true)}
});
document.addEventListener('click',e=>{const a=e.target.closest('[data-set-v],[data-set-p]');if(!a)return;e.preventDefault();go(a.dataset.setV?{v:a.dataset.setV}:{p:a.dataset.setP})});
/* final look: a product card's photo or name opens the product page */
document.addEventListener('click',e=>{
  if(CUR.v!=='final')return;
  const t=e.target.closest('#site .card .img,#site .card h3'); if(!t)return;
  const c=t.closest('.card'), name=c.querySelector('h3').textContent, pk=(c.querySelector('.pk')||{}).textContent||'';
  const i=PRODUCTS.findIndex(p=>p.name===name&&(!p.pack||pk.startsWith(p.pack)));
  if(i>=0)go({p:'product',i});
});
addEventListener('hashchange',render); addEventListener('resize',()=>document.querySelectorAll('#site .tabs [role=tablist]').forEach(moveInd)); render();
</script>
