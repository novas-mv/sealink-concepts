<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sealink · Website concepts</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ============ Base (shared, no visual style) ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ul,figure{margin:0;padding:0}
ul{list-style:none}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.w{max-width:calc(1240px + 2*var(--pad));margin:0 auto;padding-inline:var(--pad)}
:root{--pad:clamp(20px,5vw,100px)}
.mk,.crop,.sweep,.ta{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:18px;height:18px;flex:none}

/* ============ Switcher bar (presentation chrome, not part of the site) ============ */
#bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:28px;height:52px;padding:0 20px;background:#18181B;color:#E4E4E7;font:500 13px/1 system-ui,-apple-system,sans-serif}
#bar .grp{display:flex;gap:4px;align-items:center}
#bar .lbl{color:#A1A1AA;margin-right:6px}
#bar a{text-decoration:none;padding:8px 12px;border-radius:6px;color:#D4D4D8}
#bar a:hover{background:#27272A}
#bar a[aria-current="true"]{background:#F4F4F5;color:#18181B}
#bar .note{margin-left:auto;color:#A1A1AA}
#bar a.back{color:#fff;margin-right:12px;border:1px solid #3F3F46}
body.bare #bar{display:none}
#bar a{white-space:nowrap}
@media (max-width:1500px){#bar{height:auto;min-height:52px;flex-wrap:wrap;gap:6px 20px;padding-block:6px}#bar .note{display:none}}
@media (max-width:900px){#bar{height:auto;flex-wrap:wrap;gap:6px 12px;padding:8px 10px}#bar .note{display:none}#bar a{padding:7px 8px}}
@media (max-width:600px){#bar .lbl{display:none}#bar .grp{width:100%;overflow-x:auto;scrollbar-width:none}#bar a{white-space:nowrap}#bar a.back{margin-right:4px}}

/* ============ Shared structure ============ */
.hd .w{display:flex;align-items:center}
.hd .logo img{display:block}
.hd nav{display:flex}
.hd nav a{text-decoration:none}
.hd .side{margin-left:auto;display:flex;align-items:center}
.hd .side a{text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.hd .menu{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap;cursor:pointer}
.search{display:flex;align-items:center}
.search .q{flex:1;display:flex;overflow:hidden;align-items:center;gap:12px;min-width:0}
.search .q span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .cols{display:grid}
.ft a{text-decoration:none}
.card .img{display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img img{object-fit:contain}
.card .nph{display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%}
.card .add{width:100%}
.grid{display:grid}
.qbar{position:sticky;bottom:0;z-index:5}
.qbar .w{display:flex;align-items:center;gap:20px}
.qbar .w>:last-child{margin-left:auto}
.fbtn{display:none}
.outlet .w{display:flex;align-items:center;flex-wrap:wrap}
.outlet img{height:34px;width:auto}

/* =====================================================================
   1 · APEX   [data-v="apex"]   navy leads, red accent, the A does 3 jobs
   ===================================================================== */
[data-v="apex"]{--n:#1C1266;--r:#F03010;--rt:#C42A10;--soft:#4B4677;--pale:#F4F3F8;--rule:#D9D7E6;--d:'Red Hat Display',system-ui,sans-serif;--t:'Red Hat Text',system-ui,sans-serif;
  font-family:var(--t);color:var(--n);font-size:17px;line-height:1.55;background:#fff}
[data-v="apex"] h1,[data-v="apex"] h2{font-family:var(--d);font-weight:900;letter-spacing:-.035em}
[data-v="apex"] h3{font-family:var(--d);font-weight:700;letter-spacing:-.01em}
[data-v="apex"] .x{background:var(--pale);padding:0 5px;border-radius:2px;font-weight:500;white-space:nowrap}
[data-v="apex"] .A{display:block;aspect-ratio:163/331;background:var(--c,var(--r));-webkit-mask:url(assets/apex.svg) center/contain no-repeat;mask:url(assets/apex.svg) center/contain no-repeat}
[data-v="apex"] .mk{display:block;width:20px;flex:none}
[data-v="apex"] .ta{display:block;width:8px;height:16px;flex:none}
[data-v="apex"] .crop{display:block;position:absolute;pointer-events:none}
[data-v="apex"] .btn{height:52px;padding:0 24px;border-radius:2px;font:700 16px/1 var(--d);background:var(--n);color:#fff;border:2px solid var(--n)}
[data-v="apex"] .btn.s{background:#fff;color:var(--n)}
[data-v="apex"] .btn:hover{background:#2B2080}[data-v="apex"] .btn.s:hover{background:var(--pale)}
[data-v="apex"] .lnk{font:700 16px var(--d);text-underline-offset:4px;text-decoration-thickness:2px}
/* header */
[data-v="apex"] .hd{border-bottom:2px solid var(--n);background:#fff}
[data-v="apex"] .hd .w{height:88px;gap:44px}
[data-v="apex"] .hd .logo img{width:170px}
[data-v="apex"] .hd nav{gap:30px;font:700 16px var(--d)}
[data-v="apex"] .hd nav a[aria-current]{box-shadow:inset 0 -3px 0 var(--r);padding-bottom:6px;margin-bottom:-9px}
[data-v="apex"] .hd .side{gap:22px;font:700 15px var(--d)}
[data-v="apex"] .hd .side .btn{height:46px;padding:0 20px;font-size:15px}
[data-v="apex"] .hd .menu{height:44px;padding:0 14px;border:2px solid var(--n);font:700 15px var(--d)}
/* search + storage shortcuts */
[data-v="apex"] .search{height:64px;border:2px solid var(--n);background:#fff}
[data-v="apex"] .search .q{padding:0 18px;color:var(--soft);font-size:17px}
[data-v="apex"] .search .go{height:100%;padding:0 26px;background:var(--n);color:#fff;font:700 16px var(--d)}
[data-v="apex"] .stg{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px;border:2px solid var(--n);font:700 14px var(--d);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--n);background:#fff}
[data-v="apex"] .stg .ta{width:9px;height:18px}
[data-v="apex"] .stg.on{background:var(--n);color:#fff}[data-v="apex"] .stg.on .A{--c:#fff}
/* home hero */
[data-v="apex"] .hero{position:relative;border-bottom:2px solid var(--n)}
[data-v="apex"] .hero .w{display:grid;grid-template-columns:7fr 5fr;gap:64px;align-items:stretch;padding-block:88px 96px}
[data-v="apex"] .hero h1{font-size:clamp(44px,5.9vw,86px);line-height:.95}
[data-v="apex"] .hero .who{font-size:21px;line-height:1.45;margin-top:26px;max-width:32ch}
[data-v="apex"] .hero .search{margin-top:44px}
[data-v="apex"] .hero .short{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
[data-v="apex"] .hero .acts{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
[data-v="apex"] .ph{background:var(--pale);border:1px dashed #A9A6C6;display:flex;align-items:flex-end;padding:14px 16px;font-size:14px;color:var(--soft)}
[data-v="apex"] .hero .ph{height:100%;min-height:520px}
/* section heads */
[data-v="apex"] .sh{display:flex;align-items:center;gap:16px;margin-bottom:36px}
[data-v="apex"] .sh h2{font-size:clamp(32px,3.6vw,52px);line-height:1}
[data-v="apex"] section.blk{padding-block:104px 0}
/* why */
[data-v="apex"] .why .rows{border-bottom:2px solid var(--n)}
[data-v="apex"] .why .row{display:grid;grid-template-columns:5fr 3fr 4fr;gap:24px;align-items:baseline;padding-block:22px;border-top:2px solid var(--n)}
[data-v="apex"] .why .row h3{font-size:30px;line-height:1.1}
[data-v="apex"] .why .row .c{font-size:18px}
[data-v="apex"] .why .row .r{font-size:18px;color:var(--soft)}
[data-v="apex"] .why .more{margin-top:28px;display:inline-block}
/* categories */
[data-v="apex"] .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
[data-v="apex"] .cat{display:flex;align-items:flex-end;height:132px;padding:18px 20px;border:2px solid var(--n);text-decoration:none;font:700 23px/1.15 var(--d);letter-spacing:-.01em}
[data-v="apex"] .cat:hover{background:var(--n);color:#fff}
/* trade quote */
[data-v="apex"] .trade{position:relative;overflow:hidden;background:var(--n);color:#fff;margin-top:120px}
[data-v="apex"] .trade .w{position:relative;padding-block:96px}
[data-v="apex"] .trade h2{font-size:clamp(34px,4.2vw,60px);line-height:1;max-width:17ch}
[data-v="apex"] .trade .rt{margin-top:20px;font-size:18px;color:#D9D7EE}
[data-v="apex"] .trade .x{background:rgba(255,255,255,.16)}
[data-v="apex"] .trade .acts{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
[data-v="apex"] .trade .btn{background:#fff;color:var(--n);border-color:#fff}
[data-v="apex"] .trade .btn.s{background:transparent;color:#fff}
[data-v="apex"] .trade .crop{right:7%;bottom:-140px;width:330px}
/* outlet */
[data-v="apex"] .outlet{border-bottom:2px solid var(--n)}
[data-v="apex"] .outlet .w{gap:18px;min-height:76px;padding-block:14px;font-size:16px}
[data-v="apex"] .outlet .lnk{margin-left:auto}
/* footer */
[data-v="apex"] .ft{background:var(--n);color:#fff;padding:72px 0 56px}
[data-v="apex"] .ft .cols{grid-template-columns:2fr 1.3fr 1fr;gap:40px}
[data-v="apex"] .ft img{width:180px}
[data-v="apex"] .ft p,[data-v="apex"] .ft li{font-size:15px;line-height:26px}
[data-v="apex"] .ft h4{margin:0 0 10px;font:700 15px var(--d)}
[data-v="apex"] .ft .x{background:rgba(255,255,255,.14)}
[data-v="apex"] .ft a{text-decoration:underline;text-underline-offset:3px}
/* products */
[data-v="apex"] .ptop{position:relative;overflow:hidden;background:var(--n);color:#fff}
[data-v="apex"] .ptop .w{position:relative;padding-block:64px 56px}
[data-v="apex"] .ptop h1{font-size:clamp(56px,7vw,112px);line-height:.9}
[data-v="apex"] .ptop .search{margin-top:32px;max-width:720px;border-color:#fff}
[data-v="apex"] .ptop .search .go{background:#fff;color:var(--n)}
[data-v="apex"] .ptop .crop{right:9%;top:28px;width:250px}
[data-v="apex"] .stabs{border-bottom:2px solid var(--n)}
[data-v="apex"] .stabs .w{display:flex;gap:10px;padding-block:22px}
[data-v="apex"] .stabs .stg{min-height:48px}
[data-v="apex"] .pbody{display:grid;grid-template-columns:240px 1fr;gap:48px;padding-block:40px 64px}
[data-v="apex"] .filters h3{font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding-bottom:10px;border-bottom:2px solid var(--n);margin:0 0 12px}
[data-v="apex"] .filters h3:not(:first-child){margin-top:32px}
[data-v="apex"] .filters label{display:flex;align-items:center;gap:12px;min-height:36px;font-size:16px}
[data-v="apex"] .filters input{width:18px;height:18px;accent-color:var(--n);margin:0}
[data-v="apex"] .rbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:2px solid var(--n);font:700 16px var(--d)}
[data-v="apex"] .rbar .sort{font:500 15px var(--t);color:var(--soft)}
[data-v="apex"] .grid{grid-template-columns:repeat(3,1fr);gap:40px 24px;padding-top:32px}
[data-v="apex"] .card .img{height:230px;background:#fff;border:2px solid var(--pale);padding:20px}
[data-v="apex"] .card .img img{max-height:186px}
[data-v="apex"] .card .nph{background:var(--pale);margin:-20px;width:calc(100% + 40px);height:calc(100% + 40px);padding:18px 20px}
[data-v="apex"] .card .nph b{font:900 30px var(--d);letter-spacing:-.03em}
[data-v="apex"] .card .nph span{font:700 13px var(--d);letter-spacing:.12em;text-transform:uppercase;color:var(--rt);display:flex;align-items:center;gap:8px}
[data-v="apex"] .card h3{font-size:20px;line-height:1.25;margin-top:16px}
[data-v="apex"] .card .br{font-size:15px;color:var(--soft);margin-top:2px}
[data-v="apex"] .card .pk{font-size:15px;margin-top:2px}
[data-v="apex"] .card .st{display:flex;align-items:center;gap:8px;margin-top:10px;font:700 12.5px var(--d);letter-spacing:.12em;text-transform:uppercase;color:var(--rt)}
[data-v="apex"] .card .add{margin-top:16px;height:46px;border:2px solid var(--n);font:700 15px var(--d)}
[data-v="apex"] .card .add.in{background:var(--n);color:#fff}
[data-v="apex"] .nores{margin-top:56px;padding:28px;border:2px dashed var(--rule)}
[data-v="apex"] .nores .tag{display:block;font:700 12px var(--d);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
[data-v="apex"] .nores p{font:700 22px/1.35 var(--d);margin-top:8px;max-width:44ch}
[data-v="apex"] .qbar{background:#fff;border-top:2px solid var(--n)}
[data-v="apex"] .qbar .w{height:76px;font:700 17px var(--d)}
[data-v="apex"] .qbar .n{color:var(--soft);font:500 16px var(--t)}
/* brands */
[data-v="apex"] .btop .w{padding-block:80px 64px}
[data-v="apex"] .btop h1{font-size:clamp(56px,7vw,112px);line-height:.9}
[data-v="apex"] .btop p{font:700 clamp(22px,2.2vw,30px)/1.3 var(--d);margin-top:22px;max-width:30ch}
[data-v="apex"] .brand{position:relative;overflow:hidden;border-top:2px solid var(--n)}
[data-v="apex"] .brand .w{position:relative;display:grid;grid-template-columns:6fr 5fr;gap:64px;padding-block:72px}
[data-v="apex"] .brand h2{font-size:clamp(52px,6.2vw,96px);line-height:.9}
[data-v="apex"] .brand .meta{font:700 22px/1.35 var(--d);margin-top:18px}
[data-v="apex"] .brand .lines{margin-top:18px;font-size:18px;max-width:40ch}
[data-v="apex"] .brand .story{margin-top:22px;color:var(--soft)}
[data-v="apex"] .brand .btn{margin-top:32px}
[data-v="apex"] .brand .ph{min-height:300px}
[data-v="apex"] .brand.lead{background:var(--n);color:#fff;border-top:0}
[data-v="apex"] .brand.lead .ph{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.4);color:#D9D7EE}
[data-v="apex"] .brand.lead .story{color:#D9D7EE}
[data-v="apex"] .brand.lead .x{background:rgba(255,255,255,.16)}
[data-v="apex"] .brand.lead .btn{background:#fff;color:var(--n);border-color:#fff}
[data-v="apex"] .brand.lead .crop{right:-50px;bottom:-230px;width:300px}
[data-v="apex"] .brand.lead .w{grid-template-columns:6fr 4fr;padding-right:calc(var(--pad) + 200px)}
[data-v="apex"] .origins{border-top:2px solid var(--n)}
[data-v="apex"] .origins .w{padding-block:36px;font:700 22px/1.4 var(--d)}
[data-v="apex"] .others{border-top:2px solid var(--n);padding-bottom:110px}
[data-v="apex"] .others .w{padding-top:72px}
[data-v="apex"] .others .list{font-size:19px}
@media (max-width:900px){
  [data-v="apex"] .hd .w{height:68px;gap:12px}[data-v="apex"] .hd .logo img{width:128px}
  [data-v="apex"] .hero .w{grid-template-columns:1fr;gap:32px;padding-block:44px 52px}
  [data-v="apex"] .hero .ph{min-height:220px;order:2}
  [data-v="apex"] .hero .who{font-size:18px}
  [data-v="apex"] .search{height:56px}[data-v="apex"] .search .go{padding:0 16px}
  [data-v="apex"] .short .stg{flex:1;justify-content:center;padding:0 8px}
  [data-v="apex"] section.blk{padding-top:64px}
  [data-v="apex"] .why .row{grid-template-columns:1fr;gap:2px}
  [data-v="apex"] .why .row h3{font-size:24px}
  [data-v="apex"] .cats{grid-template-columns:1fr 1fr;gap:10px}[data-v="apex"] .cat{height:92px;font-size:19px;padding:12px 14px}
  [data-v="apex"] .trade{margin-top:72px}[data-v="apex"] .trade .w{padding-block:64px 150px}
  [data-v="apex"] .trade .crop{width:150px;bottom:-60px;right:24px}
  [data-v="apex"] .outlet .lnk{margin-left:0}
  [data-v="apex"] .ft .cols{grid-template-columns:1fr;gap:28px}
  [data-v="apex"] .ptop .crop{width:110px;right:-10px;top:auto;bottom:-70px}
  [data-v="apex"] .stabs .w{overflow-x:auto}[data-v="apex"] .stabs .stg{padding:0 12px}
  [data-v="apex"] .pbody{grid-template-columns:1fr;gap:20px;padding-top:24px}
  [data-v="apex"] .grid{grid-template-columns:1fr 1fr;gap:28px 14px}
  [data-v="apex"] .card .img{height:160px;padding:12px}[data-v="apex"] .card .img img{max-height:130px}
  [data-v="apex"] .card .nph{margin:-12px;width:calc(100% + 24px);height:calc(100% + 24px);padding:12px}
  [data-v="apex"] .card .nph b{font-size:22px}
  [data-v="apex"] .fbtn{display:inline-flex;height:44px;padding:0 16px;border:2px solid var(--n);font:700 15px var(--d);align-items:center}
  [data-v="apex"] .brand .w,[data-v="apex"] .brand.lead .w{grid-template-columns:1fr;gap:28px;padding-block:52px;padding-right:var(--pad)}
  [data-v="apex"] .brand.lead .crop{width:120px;right:-20px;top:-60px;bottom:auto}
  [data-v="apex"] .brand .ph{min-height:200px}
}

/* =====================================================================
   2 · COLD WHITE   [data-v="cold"]   spec sheet: cool white, deep sea blue, Plex + mono
   ===================================================================== */
[data-v="cold"]{--ink:#0B2A3C;--ink2:#22394A;--soft:#4F6575;--line:#DCE4E9;--bg:#F7F9FA;--chip:#EEF3F6;--ice:#DCEEF7;--f:'IBM Plex Sans',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;
  font-family:var(--f);color:var(--ink2);font-size:16px;line-height:1.55;background:var(--bg)}
[data-v="cold"] h1,[data-v="cold"] h2,[data-v="cold"] h3{color:var(--ink);font-weight:500;letter-spacing:-.02em}
[data-v="cold"] .x{font-family:var(--m);font-size:.86em;background:var(--chip);padding:1px 6px;border-radius:2px;white-space:nowrap;color:var(--ink2)}
[data-v="cold"] .mono{font-family:var(--m);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
[data-v="cold"] .btn{height:48px;padding:0 20px;border-radius:2px;font:500 15px/1 var(--f);background:var(--ink);color:#fff;border:1px solid var(--ink)}
[data-v="cold"] .btn.s{background:#fff;color:var(--ink)}
[data-v="cold"] .lnk{font-weight:500;color:var(--ink);text-underline-offset:4px}
[data-v="cold"] .hd{background:#fff;border-bottom:1px solid var(--line)}
[data-v="cold"] .hd .w{height:76px;gap:40px}
[data-v="cold"] .hd .logo img{width:150px}
[data-v="cold"] .hd nav{gap:28px;font-size:15px;font-weight:500;color:var(--ink)}
[data-v="cold"] .hd nav a[aria-current]{box-shadow:inset 0 -2px 0 var(--ink);padding-block:27px;margin-block:-27px}
[data-v="cold"] .hd .side{gap:20px;font-size:15px;font-weight:500;color:var(--ink)}
[data-v="cold"] .hd .side .btn{height:42px;padding:0 16px;font-size:14.5px}
[data-v="cold"] .hd .menu{height:42px;padding:0 14px;border:1px solid var(--line);background:#fff;font-weight:500}
[data-v="cold"] .search{height:56px;border:1px solid #B9C7D0;background:#fff;border-radius:2px}
[data-v="cold"] .search .q{padding:0 16px;color:var(--soft)}
[data-v="cold"] .search .go{height:100%;padding:0 22px;background:var(--ink);color:#fff;font-weight:500}
[data-v="cold"] .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
[data-v="cold"] .stg{display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 16px;background:#fff;text-decoration:none;color:var(--ink);font-weight:500}
[data-v="cold"] .stg small{font-family:var(--m);font-size:12px;color:var(--soft);font-weight:400}

function home(V){
  const whyRows = (V==='cold'?`<div class="row hdr mono"><span>Partner</span><span>Origin</span><span>Relationship</span></div>`:'')
   + PARTNERS.map(p=>`<div class="row"><h3>${p.name}</h3><span class="c">${p.country}</span><span class="r">${p.role}</span></div>`).join('')
   + `<div class="row"><h3>Own cold store in Malé</h3><span class="c">${x('[CAPACITY]')}</span><span class="r">${x('[TEMPERATURE ZONES]')}</span></div>`
   + `<div class="row"><h3>Halal and delivery</h3><span class="c">${x('[HALAL CERTIFICATE]')}</span><span class="r">${x('[DELIVERY: atolls served]')}</span></div>`;
  const whyHead = sh('Why kitchens buy from Sealink');
  const why = V==='paper'
    ? `<section class="why blk"><div class="w"><div>${whyHead}<a class="lnk more" ${L('brands')}>See all brands</a></div><div class="rows">${whyRows}</div></div></section>`
    : `<section class="why blk"><div class="w">${whyHead}<div class="rows">${whyRows}</div><a class="lnk more" ${L('brands')}>See all brands</a></div></section>`;
  const hero = V==='quiet'
    ? `<section class="hero"><div class="w">
        <h1>Fresh, chilled and frozen food, kept cold since 1994.</h1>
        <p class="who">Supplying resorts, hotels and restaurants across the Maldives.</p>
        <div class="find">${search(V,'Search products, brands or codes')}${shortcuts(V)}</div>
        <div class="acts"><a class="btn" ${L('trade')}>Request a quote</a><a class="btn s" ${L('contact')}>WhatsApp us</a></div>
        <figure class="fig">${pic(...HERO[V])}<i class="sweep" aria-hidden="true"><i></i></i></figure>
      </div></section>`
    : `<section class="hero"><div class="w"><div>
        <h1>Fresh, chilled and frozen food, kept cold since 1994.</h1>
        <p class="who">Supplying resorts, hotels and restaurants across the Maldives.</p>
        ${search(V,'Search products, brands or codes')}${shortcuts(V)}
        <div class="acts"><a class="btn" ${L('trade')}>Request a quote</a><a class="btn s" ${L('contact')}>WhatsApp us</a></div>
        ${V==='paper'?`<p class="mpline">Shopping for home? <a class="lnk" ${L('outlets')}>Visit a Meatplus outlet</a></p>`:''}
      </div>${pic(...HERO[V])}</div></section>`;
  const cats = `<section class="blk"><div class="w">${sh('Browse by category')}<div class="cats">${CATS.map(c=>`<a class="cat" ${L('products')}>${c}</a>`).join('')}</div></div></section>`;
  const tradeBand = `<section class="trade">${A('crop')}<div class="w"><h2>Supplying a resort or restaurant? Send us your list and we reply with prices.</h2>
     <p class="rt">We reply within ${x('[REPLY TIME]')}.</p>
     <div class="acts"><a class="btn" ${L('trade')}>Request a quote</a><a class="btn s" ${L('trade')}>How trade accounts work</a></div></div></section>`;
  /* Navy and Paper (and Final): categories before "why", then the trade band, then a full Meatplus section */
  if(V==='paper') return header(V,'home')+`<main>${hero}${cats}${why.replace('why blk','why blk after')}${tradeBand}${meatplus(V)}</main>`+footer(V);
  return header(V,'home')+`<main>${hero}${why}${cats}${tradeBand}${outlet(V)}</main>`+footer(V);
}
function card(p,V){
  const src = p.img ? IMG+p.img : p.ph && !p.ph.startsWith('X:') ? IMG+p.ph+'.webp' : '';
  const img = src ? `<img src="${src}" alt="${p.brand} ${p.name}, ${p.pack||''}" loading="lazy">` : `<div class="nph"><b>${p.brand}</b><span>Pack photo to come</span></div>`;
  const pack = (p.pack || '[PACK]') + (p.origin ? ' · '+p.origin : '');
  const st = `<p class="st">${V==='apex'?A('ta'):''}${p.st}</p>`;
  const meta = (V==='cold'||V==='paper')
    ? `<div class="meta"><p class="br">${p.brand}</p><h3>${p.name}</h3><div class="chips"><span class="pk">${pack}</span>${st.replace('<p','<span').replace('</p>','</span>')}</div></div>`
    : `<h3>${p.name}</h3><p class="br">${p.brand}</p><p class="pk">${p.pack?pack:x('[PACK]')}</p>${st}`;
  return `<article class="card"><div class="img">${img}</div>${meta}<button class="add${p.inq?' in':''}" type="button">${p.inq?'In quote list':'Add to quote'}</button></article>`;
}
function products(V){

function brands(V){
  const block=(p,i)=>{
    const lead = V==='apex' && i===0;
    const meta = `${p.maker?p.maker+', ':''}${p.country} · ${p.role.charAt(0).toLowerCase()+p.role.slice(1)}`;
    const linesTxt = V==='paper' ? `<div class="lines"><b>Product lines</b>${p.lines}</div>` : `<p class="lines">${p.lines}</p>`;
    if(V==='cold') return `<article class="brand"><div class="w"><div>
        <div class="txt"><h2>${p.name}</h2><p class="meta">${meta}</p><a class="btn s" href="#">See ${p.name} products</a></div>

        ${pic(...PARTNER_PIC[p.name])}</div></div></article>`;
    return `<article class="brand${lead?' lead':''}">${lead?A('crop'):''}<div class="w">
      <div class="txt"><h2>${p.name}</h2><p class="meta">${meta}</p>${linesTxt}<p class="story">${x('[STORY: 2–3 lines]')}</p>
      <a class="btn${lead?'':' s'}" href="#">See ${p.name} products</a></div>
      ${pic(...PARTNER_PIC[p.name])}</div></article>`;
  };
  return header(V,'brands')+`<main>
   <section class="btop"><div class="w"><h1>Brands</h1><p>We are the Maldives distributor for these producers, some for more than 25 years.</p>${V==='quiet'?'<i class="sweep" aria-hidden="true"><i></i></i>':''}</div></section>

   <section class="others"><div class="w">${sh('Other brands we carry')}<p class="list">${x('[FULL BRAND LIST]')}</p></div></section>
  </main>`+footer(V);
}

function trade(V){
  const steps=[
    ['Send your list','Use the form on this page, or send the list on WhatsApp or Viber. You can also tick items on the products page with Add to quote.'],
    ['We reply with prices',`We send a price for each item on your list within ${x('[REPLY TIME]')}.`],
    ['Confirm the order','Tell us what you want to order and when you need it.'],
    ['Delivery',`${x('[DELIVERY: days, order cut-off, atolls served]')}`],
  ];
  return header(V,'trade')+`<main>
   ${pageTop('For Trade','For resorts, hotels, restaurants and caterers in the Maldives. Send us your product list and we reply with trade prices.')}
   <section class="sec"><div class="w">${sh('How a quote works')}
     <ol class="steps">${steps.map(([h,p])=>`<li><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol></div></section>
   <section class="sec"><div class="w split">
     <div>${sh('Trade accounts')}<p class="lede">Regular customers can open a trade account. ${x('[ACCOUNT: who can open one and what we need]')}</p>
       <a class="lnk" ${L('products')}>Browse products</a></div>
     ${facts([['Prices',x('[PRICE TERMS]')],['Payment',x('[PAYMENT TERMS]')],['Minimum order',x('[MINIMUM ORDER]')],['Delivery',x('[DELIVERY: atolls served]')],['Certificates',x('[HALAL CERTIFICATE]')]])}
   </div></section>
   <section class="fband" id="quote"><div class="w">
     <div class="side">${sh('Request a quote')}<p>List the products and pack sizes you need. Rough quantities are fine.</p>
       <p class="alt">Prefer to message? WhatsApp ${x('[NUMBER]')}, Viber ${x('[NUMBER]')}, or call ${PHONE}.</p></div>
     ${quoteForm()}
   </div></section>
  </main>`+footer(V);
}

      p.role.startsWith('Sole')?`Sole distributor for ${p.name}`:`Partnership with ${p.name}`,
      `${p.maker?p.maker+', ':''}${p.country}. ${p.lines}.`]),
    ['Today','Sealink today',x('[TODAY: staff, vehicles, customers served]')],
  ];
  return header(V,'about')+`<main>
   ${pageTop('About Sealink','Sealink has imported and distributed fresh, chilled and frozen food in the Maldives since 1994.')}
   <section class="sec"><div class="w split">
     <div>${sh('Our story')}<p class="lede">We supply resorts, hotels and restaurants across the Maldives. Home shoppers in Malé buy from us at the Meatplus Foods outlets.</p>
       <a class="lnk" ${L('outlets')}>Meatplus outlets</a></div>
     <ol class="tl">${ms.map(([y,h,p])=>`<li><b>${y}</b><div><h3>${h}</h3><p>${p}</p></div></li>`).join('')}</ol>
   </div></section>
   <section class="sec"><div class="w split">

     <div>${sh('Our cold store in Malé')}<p class="lede">Frozen, chilled and fresh goods are kept in our own cold store in Malé until they go out to customers.</p>
       ${facts([['Capacity',x('[CAPACITY]')],['Frozen',x('[TEMPERATURE]')],['Chilled',x('[TEMPERATURE]')],['Fresh',x('[TEMPERATURE]')],['Delivery',x('[DELIVERY: atolls served]')]])}</div>
   </div></section>
   <section class="sec"><div class="w">${sh('Partners')}
     ${facts(PARTNERS.map(p=>[p.name,`${p.maker?p.maker+', ':''}${p.country} · ${p.role.charAt(0).toLowerCase()+p.role.slice(1)}`]))}

   <section class="sec last"><div class="w two">

     <div>${sh('Certificates','h2')}<p>Halal: ${x('[HALAL CERTIFICATE: body, number, expiry]')}</p><p style="margin-top:8px">Food safety: ${x('[MFDA OR OTHER LICENCE]')}</p></div>
   </div></section>

}

     <div class="acts"><a class="btn" ${L('trade')}>Request a quote</a><a class="btn s" ${L('trade')}>How trade accounts work</a></div></div></section>

const DEFAULT_PRODUCT=()=>Math.max(0,PRODUCTS.findIndex(p=>p.name.startsWith('Cream Cheese')&&p.img));
const pimg=p=>p.img?IMG+p.img:p.ph?IMG+p.ph+'.webp':'';
function product(V,s){
  const i=PRODUCTS[s&&s.i]?s.i:DEFAULT_PRODUCT(), p=PRODUCTS[i], src=pimg(p);
  const rel=PRODUCTS.map((q,j)=>[q,j]).filter(([q,j])=>j!==i&&q.cat===p.cat&&q.name!==p.name).slice(0,4);
  return header(V,'products')+`<main>
   <div class="w crumbs"><a ${L('products')}>Products</a> / ${p.cat} / ${p.name}</div>
   <section class="w pd">
     <div class="shot">${src?`<img src="${src}" alt="${p.brand} ${p.name}, ${p.pack||''}">`:`<div class="none"><b>${p.brand}</b>Pack photo to come</div>`}</div>
     <div>
       <p class="br">${p.brand}</p><h1>${p.name}</h1>
       <div class="chips"><span>${p.pack||x('[PACK]')}</span><span class="tag-st">${p.st}</span></div>
       <p class="desc">${x('[DESCRIPTION: 2–3 lines]')}</p>
       <div class="acts"><button class="btn" type="button">Add to quote</button><a class="btn s" ${L('contact')}>Ask on WhatsApp</a></div>
       <p class="pnote">Prices are sent with your quote.</p>
       ${facts([['Pack size',p.pack||x('[PACK]')],['Origin',p.origin||x('[ORIGIN]')],['Storage',`${p.st}, ${x('[STORAGE TEMPERATURE]')}`],['Category',p.cat],['Product code',x('[SKU CODE]')],['Shelf life',x('[SHELF LIFE]')],['Halal',x('[HALAL STATUS]')],['Spec sheet',x('[SPEC SHEET PDF]')]])}
     </div>
   </section>
   ${rel.length?`<section class="sec last"><div class="w">${sh('More in '+p.cat.toLowerCase())}<div class="rel">${rel.map(([q])=>card(q,V)).join('')}</div></div></section>`:'<div class="sec last"></div>'}
  </main>`+footer(V);
}

/* ---------- Router (state in the URL hash: #v=apex&p=home) ---------- */
/* The final look renders the shared page functions with the paper content (V='paper')
   inside an inner [data-v="paper"] wrapper, so paper CSS applies and [data-v="final"] adds to it.
   The new pages (trade, about, contact, outlets, product) exist in the final look only. */
const VS=['final','apex','cold','paper'], PS=['home','products','brands','trade','about','contact','outlets','product'];
const FINAL_ONLY=['trade','about','contact','outlets','product'];
const PAGES={home,products,brands,trade,about,contact,outlets,product};
function state(){const h=new URLSearchParams(location.hash.slice(1));
  const s={v:VS.includes(h.get('v'))?h.get('v'):'final',p:PS.includes(h.get('p'))?h.get('p'):'home',i:h.has('i')?parseInt(h.get('i'),10):null,bare:h.has('bare')};
  if(FINAL_ONLY.includes(s.p)&&s.v!=='final')s.v='final';
  return s}
function go(o){const s={...state(),...o};
  if(FINAL_ONLY.includes(s.p)&&s.v!=='final'){if(o.v)s.p='home';else s.v='final'}
  if(s.p!=='product')s.i=null;
  location.hash=`v=${s.v}&p=${s.p}${s.i!=null?'&i='+s.i:''}${s.bare?'&bare':''}`}
function render(){
  const s=state(), el=document.getElementById('site'); CUR=s;
  el.dataset.v=s.v; el.dataset.p=s.p; document.body.classList.toggle('bare',s.bare);
  const html=PAGES[s.p](s.v==='final'?'paper':s.v,s);
  el.innerHTML=s.v==='final'?`<div data-v="paper">${html}</div>`:html;
  document.querySelectorAll('[data-set-v]').forEach(a=>a.setAttribute('aria-current',a.dataset.setV===s.v));
  document.querySelectorAll('[data-set-p]').forEach(a=>a.setAttribute('aria-current',a.dataset.setP===s.p));
  document.title=`Sealink · ${s.v} · ${s.p}`;
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-set-v],[data-set-p]');if(!a)return;e.preventDefault();go(a.dataset.setV?{v:a.dataset.setV}:{p:a.dataset.setP})});
/* final look: a product card's photo or name opens the product page */
document.addEventListener('click',e=>{
  if(CUR.v!=='final')return;
  const t=e.target.closest('#site .card .img,#site .card h3'); if(!t)return;
  const c=t.closest('.card'), name=c.querySelector('h3').textContent, pk=(c.querySelector('.pk')||{}).textContent||'';
  const i=PRODUCTS.findIndex(p=>p.name===name&&(!p.pack||pk.startsWith(p.pack)));
  if(i>=0)go({p:'product',i});
});
addEventListener('hashchange',render); render();
</script>
